[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pariksha"
version = "0.1.0"
description = "Reliability tests for AI agents that take actions: inject tool failures and check what the agent really did"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Malaya Kumar Swain" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai-agents", "agent-evaluation", "reliability", "fault-injection", "llm", "mcp", "responsible-ai", "testing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-pariksha = "pariksha.__main__:main"

[project.urls]
Homepage = "https://github.com/Malaya-kumar-swain/agent-pariksha"

[tool.setuptools.packages.find]
include = ["pariksha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
